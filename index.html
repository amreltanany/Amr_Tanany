<!doctype html>
<html lang="en">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMR ELTANANY</title>
    <link rel="icon" type="image/svg+xml" href="/Amr_Tanany/favicon.svg" />
    
    <link rel="icon" href="/Amr_Tanany/favicon.svg">
    <meta property="og:title" content="AMR ELTANANY">
    <script type="module" crossorigin src="/Amr_Tanany/assets/index-tAtIHW1z.js"></script>
    <link rel="stylesheet" crossorigin href="/Amr_Tanany/assets/index-OfYI4tAo.css">
    <style>
      /* Mobile fix: project images must stay full-width and never overflow */
      .project-card {
        min-width: 0;
        width: 100%;
        max-width: 100%;
      }
      .project-image {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow: hidden;
      }
      .project-image a {
        display: block;
        width: 100%;
        max-width: 100%;
        height: 100%;
      }
      .project-image img {
        display: block;
        width: 100%;
        max-width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }
      @media (max-width: 1100px) {
        .project-card {
          grid-template-columns: 40px minmax(0, 1.1fr) minmax(0, 0.9fr);
          gap: 20px;
        }
        .project-image {
          height: clamp(260px, 36vw, 480px);
        }
      }
      @media (max-width: 900px) {
        .project-card {
          grid-template-columns: 1fr;
          gap: 22px;
        }
        .project-number {
          display: none;
        }
        .project-image {
          height: auto;
          aspect-ratio: 16 / 10;
          min-height: 0;
        }
        .project-info {
          max-width: 100%;
        }
      }
      @media (max-width: 800px) {
        .project-card {
          grid-template-columns: 1fr;
          gap: 18px;
          width: 100%;
          max-width: 100%;
          min-width: 0;
        }
        .project-number {
          display: none;
        }
        .project-image {
          width: 100%;
          max-width: 100%;
          min-width: 0;
          height: auto;
          aspect-ratio: 4 / 3;
          min-height: 0;
        }
        .project-info {
          max-width: 100%;
        }
        .project-info h3 {
          font-size: clamp(28px, 8vw, 42px);
        }
      }
    </style>
  </head>
  <body>
    
    <div id="root"></div>
    
  </body>
</html>
