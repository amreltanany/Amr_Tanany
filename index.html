    <!-- Intro loader: decides BEFORE the page paints, inline, so there is no flash -->
    <script>
    (function () { var d = document.documentElement; try {
      var base = "%BASE_URL%";
      var force = /[?&]loader=1/.test(location.search);                         // ?loader=1 forces it, for previews
      var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
      var fresh = !nav || nav.type === "navigate";                              // not reload / back_forward
      var internal = document.referrer && document.referrer.indexOf(location.origin) === 0; // came from our own site
      var home = location.pathname === base || location.pathname === base + "index.html";
      if (force || (home && fresh && !internal)) { d.classList.add("loading"); setTimeout(function () { d.classList.remove("loading"); }, 3400); }
    } catch (e) {} })();
    </script>
    <style>
      .loader { position: fixed; inset: 0; z-index: 5000; display: none; place-items: center; background: #11110f; color: #f2eee8; overflow: hidden; direction: ltr; }
      html.loading .loader { display: grid; animation: ld-lift .75s cubic-bezier(.76,0,.24,1) 2.55s forwards; }
      html.loading, html.loading body { overflow: hidden; }
      html.loading .reveal-up, html.loading .reveal-in { animation-play-state: paused; }
      .loader__pair { display: flex; align-items: center; --mark: clamp(4.6rem, 9vw, 7.2rem); }
      .loader__mark { flex: 0 0 auto; width: var(--mark); height: var(--mark); border-radius: 50%; background: #c47b57; display: grid; place-items: center; transform: scale(0);
        animation: ld-dot .5s cubic-bezier(.34,1.56,.64,1) .1s forwards, ld-settle .9s ease-in-out .65s forwards; }
      .loader__mark svg { width: 50%; height: auto; display: block; color: #f2eee8; clip-path: inset(0 100% 0 0); animation: ld-reveal .55s cubic-bezier(.65,0,.35,1) .45s forwards; }
      .loader__name { display: grid; grid-template-columns: 0fr; animation: ld-open .7s cubic-bezier(.65,0,.35,1) 1.15s forwards; }
      .loader__name > div { min-width: 0; overflow: hidden; padding-left: clamp(.9rem, 2vw, 1.6rem); padding-block: .2em; }
      .loader__text { display: block; white-space: nowrap; transform: translateY(115%); animation: ld-rise .7s cubic-bezier(.22,1,.36,1) 1.25s forwards; }
      .loader__text strong { display: block; font: 700 clamp(1.25rem, 3.1vw, 2.5rem)/1.02 'Space Grotesk', sans-serif; letter-spacing: .01em; text-transform: uppercase; }
      .loader__text span { display: block; margin-top: .35em; font: 700 clamp(.62rem, 1.2vw, .95rem) 'Space Grotesk', sans-serif; letter-spacing: .42em; text-transform: uppercase; color: #c47b57; }
      @keyframes ld-dot { from { transform: scale(0); } to { transform: scale(1); } }
      @keyframes ld-settle { 0% { transform: scale(1); } 55% { transform: scale(.92); } 100% { transform: scale(1); } }
      @keyframes ld-reveal { to { clip-path: inset(0 0 0 0); } }
      @keyframes ld-open { to { grid-template-columns: 1fr; } }
      @keyframes ld-rise { to { transform: translateY(0); } }
      @keyframes ld-lift { to { transform: translateY(-100%); visibility: hidden; } }
      @media (max-width: 560px) { .loader__text strong { font-size: 1.15rem; } }
    </style>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->

        <div class="loader__name"><div><div class="loader__text"><strong>Amr ElTanany</strong><span>Design + Engineering</span></div></div></div>
      </div>
    </div>

    <!-- figma:body-end -->
  </body>
