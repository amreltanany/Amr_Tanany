<!doctype html>
<html lang="en">
  <head>
    
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMR ELTANANY</title>
    <link rel="icon" type="image/svg+xml" href="/Amr_Tanany/favicon.svg" />
    
    <link rel="icon" href="/Amr_Tanany/favicon.svg">
    <meta property="og:title" content="AMR ELTANANY">
    <script type="module" crossorigin src="/Amr_Tanany/assets/index-tAtIHW1z.js"></script>
    <link rel="stylesheet" crossorigin href="/Amr_Tanany/assets/index-OfYI4tAo.css">
    <style>
      /* Project images: full width, no horizontal overflow */
      .project-card {
        min-width: 0;
        width: 100%;
        max-width: 100%;
      }
      .project-image {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow: hidden;
      }
      .project-image a {
        display: block;
        width: 100%;
        max-width: 100%;
      }
      .project-image img {
        display: block;
        width: 100%;
        max-width: 100%;
      }

      /* Tablet: stack earlier so the grid doesn't overflow */
      @media (max-width: 900px) {
        .project-card {
          grid-template-columns: 1fr !important;
          gap: 20px;
        }
        .project-number {
          display: none !important;
        }
        .project-image {
          height: auto !important;
          min-height: 0 !important;
          aspect-ratio: auto !important;
        }
        .project-image a {
          height: auto !important;
        }
        .project-image img {
          width: 100% !important;
          height: auto !important;
          max-height: none !important;
          object-fit: contain !important;
          object-position: center top;
        }
        .project-info {
          max-width: 100%;
        }
      }

      /* Phone */
      @media (max-width: 800px) {
        .project-card {
          grid-template-columns: 1fr !important;
          gap: 16px;
          width: 100%;
          max-width: 100%;
          min-width: 0;
        }
        .project-number {
          display: none !important;
        }
        .project-image {
          width: 100% !important;
          max-width: 100% !important;
          min-width: 0 !important;
          height: auto !important;
          min-height: 0 !important;
          aspect-ratio: auto !important;
        }
        .project-image a {
          height: auto !important;
        }
        .project-image img {
          width: 100% !important;
          height: auto !important;
          max-height: none !important;
          object-fit: contain !important;
        }
        .project-info {
          max-width: 100%;
        }
        .project-info h3 {
          font-size: clamp(28px, 8vw, 42px);
        }
      }
    </style>
  </head>
  <body>
    
    <div id="root"></div>
    
  </body>
</html>
